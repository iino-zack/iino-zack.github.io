{{ if .Store.Get "hasMermaid" }}
<style>
  .mermaid-wrapper { position: relative; cursor: zoom-in; overflow: auto; }
  .mermaid-wrapper svg, .mermaid-modal-content svg { width: 100% !important; height: auto !important; max-width: none !important; }
  .mermaid-wrapper svg { max-height: 600px !important; }
  .mermaid-modal-content svg { height: 100% !important; cursor: grab; }
  .mermaid-modal-content svg:active { cursor: grabbing; }

  .mermaid-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 99999; display: flex; }
  .mermaid-modal-content { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  .mermaid-modal-close { position: absolute; top: 10px; right: 15px; background: transparent; border: none; font-size: 2rem; color: #fff; cursor: pointer; z-index: 100000; }
</style>
{{ end }}
